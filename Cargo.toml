[package]
name = "mini_http"
version = "0.2.0"
edition = "2024"
description = "A lightweight HTTP framework built from scratch in Rust"
license = "MIT"
keywords = ["http", "web", "framework", "server"]
categories = ["web-programming::http-server"]

[lib]
name = "mini_http"
path = "src/lib.rs"

[[bin]]
name = "mini_http_example"
path = "src/main.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "rest_api"
path = "examples/rest_api.rs"

[[example]]
name = "middleware_example"
path = "examples/middleware_example.rs"

[dependencies]
# HTTP parsing
httparse = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL encoding/decoding
urlencoding = "2"

# MIME types
mime_guess = "2"

# Logging
log = "0.4"
chrono = "0.4"

# Routing
regex = "1"

# Compression
flate2 = "1"

# TLS (using ring crypto provider to avoid aws-lc-sys C build dependency)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# Templates
tera = "1"

# Session IDs
uuid = { version = "1", features = ["v4"] }

# WebSocket
sha1 = "0.10"
base64 = "0.22"

# Graceful shutdown
ctrlc = "3"

[dev-dependencies]
dotenvy = "0.15"
env_logger = "0.11"